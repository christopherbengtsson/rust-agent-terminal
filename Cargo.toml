[package]
name = "agent-terminal"
version = "0.1.0"
edition = "2024"
publish = false
description = "A terminal dashboard for Git worktrees and coding-agent sessions"

[dependencies]
crossterm = { version = "0.29", features = ["serde"] }
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4"] }
vt100 = "0.18.1"

[dev-dependencies]
tempfile = "3"
