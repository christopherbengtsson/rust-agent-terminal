[package]
name = "agent-terminal"
version = "0.1.0"
edition = "2024"
publish = false
description = "A terminal dashboard for Git worktrees and coding-agent sessions"

[dependencies]
crossterm = { version = "0.29", features = ["serde"] }
libc = "0.2"
portable-pty = "0.9.0"
ratatui = "0.30.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4"] }
# The std feature enables vte's unbounded OSC Vec. We only use process();
# disabling it keeps the parser's OSC payload at its fixed 1024-byte cap.
vt100 = { version = "0.18.1", default-features = false }

[dev-dependencies]
tempfile = "3"
